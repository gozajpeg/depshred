name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x', '26.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify zero runtime dependencies
        run: |
          DEPS_COUNT=$(node -e "const pkg = require('./package.json'); console.log(Object.keys(pkg.dependencies || {}).length);")
          if [ "$DEPS_COUNT" != "0" ]; then
            echo "Error: depshred must have 0 runtime dependencies, found $DEPS_COUNT"
            exit 1
          fi

      - name: Run automated test suite
        run: node --test test/*.test.js

      - name: Run CLI self-audit check
        run: node bin/depshred.js --check
